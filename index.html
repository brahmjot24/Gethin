<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>84-Day Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0ED; --surface:#FFFFFF; --ink:#1B232B; --steel:#5B6874; --line:#D5D9D6;
  --plate:#E8B923; --plate-ink:#1B232B; --warm:#C4602D; --rest:#E2E5E2; --focus:#1F6FB2;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A20; --surface:#1E262E; --ink:#E9ECEA; --steel:#98A4AE; --line:#2E3842; --plate:#EFC23A; --plate-ink:#141A20; --warm:#E08452; --rest:#1A2128; --focus:#6FB2EE;
}}
:root[data-theme="dark"]{ --bg:#141A20; --surface:#1E262E; --ink:#E9ECEA; --steel:#98A4AE; --line:#2E3842; --plate:#EFC23A; --plate-ink:#141A20; --warm:#E08452; --rest:#1A2128; --focus:#6FB2EE; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
.hidden{display:none!important}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.bar h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:0;flex:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;min-width:44px;height:44px;display:grid;place-items:center;padding:0 10px}
.tabs{display:flex;gap:6px;margin:14px 0 4px}
.tab{flex:1;background:none;border:1px solid var(--line);border-radius:10px;padding:9px;font-weight:600;color:var(--steel)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* hero */
.hero{padding:22px 0 8px}
.hero .num{font-family:var(--cond);font-weight:800;font-size:clamp(96px,30vw,150px);line-height:.82;letter-spacing:-.02em;margin:0}
.hero .num small{font-size:.28em;font-weight:600;color:var(--steel);letter-spacing:0;margin-right:.15em;vertical-align:.12em}
.hero .what{font-family:var(--cond);font-size:30px;font-weight:600;margin:10px 0 2px}
.hero .sub{color:var(--steel);margin:0 0 16px}
.primary{display:block;width:100%;background:var(--plate);color:var(--plate-ink);border:0;border-radius:12px;padding:15px;font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.02em}
.secondary{background:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600}
/* grid */
.grid-head{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px}
.grid-head h3,.sec h3{font-family:var(--cond);font-weight:700;font-size:22px;margin:0}
.grid-head span{color:var(--steel);font-size:14px}
.grid{display:grid;grid-template-columns:34px repeat(7,1fr);gap:5px;align-items:center}
.wk{font-family:var(--cond);color:var(--steel);font-size:14px;text-align:right;padding-right:4px}
.cell{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--cond);font-weight:600;font-size:15px;display:grid;place-items:center;padding:0;position:relative}
.cell.rest{background:repeating-linear-gradient(135deg,var(--rest) 0 4px,transparent 4px 8px),var(--surface);color:var(--steel)}
.cell.part{box-shadow:inset 0 -4px 0 var(--plate)}
.cell.done{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--steel);font-size:13px;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
/* settings */
.sec{margin-top:28px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 12px;min-width:48px;font-weight:600;color:var(--steel)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sync{font-size:13px;color:var(--steel);margin-top:10px}
/* workout */
.dayhead{padding:18px 0 6px}
.dayhead .k{font-family:var(--cond);font-size:48px;font-weight:800;line-height:.9;margin:0}
.dayhead p{margin:6px 0 0;color:var(--steel)}
.prog{height:6px;background:var(--line);border-radius:3px;margin:14px 0 6px;overflow:hidden}
.prog>div{height:100%;background:var(--plate);width:0;transition:width .3s}
.group{border-left:4px solid var(--plate);padding-left:10px;margin:18px 0}
.group>.glabel{font-family:var(--cond);font-weight:700;font-size:17px;color:var(--steel);margin:0 0 -6px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.group .ex{margin:12px 0}
.ex.complete{border-color:var(--plate)}
.ex h4{font-family:var(--cond);font-weight:700;font-size:23px;line-height:1.1;margin:0}
.ex .det{color:var(--steel);font-size:14px;margin:4px 0 0}
.last{font-size:13px;margin:8px 0 0;padding:6px 9px;border-radius:8px;background:var(--bg);color:var(--steel)}
.last b{color:var(--ink);font-weight:600}
.sets{margin-top:10px}
.set{display:grid;grid-template-columns:34px 1fr 16px 1fr 48px;align-items:center;gap:6px;margin:6px 0}
.tag{font-family:var(--cond);font-weight:700;font-size:16px;text-align:center;color:var(--steel)}
.tag.W{color:var(--warm)}
.set input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;font-family:var(--cond);font-size:21px;font-weight:600;padding:0 4px}
.set input::placeholder{color:var(--steel);opacity:.6;font-weight:500}
.set .x{text-align:center;color:var(--steel);font-family:var(--cond)}
.chk{height:44px;border-radius:10px;border:1px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.chk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:3;opacity:.25}
.chk[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.chk[aria-pressed="true"] svg{opacity:1}
.set.done input{border-color:transparent}
.colhead{display:grid;grid-template-columns:34px 1fr 16px 1fr 48px;gap:6px;font-size:12px;color:var(--steel);text-align:center}
.addset{background:none;border:0;color:var(--steel);font-weight:600;padding:8px 0;font-size:14px}
.simple{display:flex;align-items:center;gap:12px}
.simple .chk{width:48px;flex:none}
.simple h4{flex:1}
.finish{margin-top:24px}
.navdays{display:flex;gap:8px;margin-top:12px}
.navdays button{flex:1}
/* history */
.hist-item{border-bottom:1px solid var(--line)}
.hist-item>button{width:100%;background:none;border:0;text-align:left;padding:13px 0;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hist-item .nm{font-family:var(--cond);font-weight:700;font-size:20px}
.hist-item .bst{color:var(--steel);font-size:14px;white-space:nowrap}
.hist-body{padding:0 0 12px}
.hist-body p{margin:4px 0;font-size:14px}
.hist-body p span{color:var(--steel);display:inline-block;min-width:62px}
.empty{color:var(--steel);padding:24px 0}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;transform:translateY(110%);transition:transform .25s}
.timer.on{transform:none}
.timer .t{font-family:var(--cond);font-weight:800;font-size:34px;min-width:84px;font-variant-numeric:tabular-nums}
.timer .lbl{flex:1;font-size:14px;opacity:.75}
.timer button{background:none;border:1px solid currentColor;color:inherit;border-radius:10px;height:42px;padding:0 12px;font-weight:600}
.timer.over .t{color:var(--plate)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <!-- HOME -->
  <section id="home">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="plan" aria-selected="true">Program</button>
      <button class="tab" role="tab" data-tab="hist" aria-selected="false">Lift history</button>
    </div>
    <div id="plan">
      <div class="hero">
        <p class="num" id="heroNum"><small>Day</small>1</p>
        <p class="what" id="heroWhat"></p>
        <p class="sub" id="heroSub"></p>
        <button class="primary" id="startBtn">Start workout</button>
      </div>
      <div class="grid-head"><h3>12 weeks</h3><span id="doneCount"></span></div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i style="background:var(--plate);border-color:var(--plate)"></i>Done</span><span><i style="box-shadow:inset 0 -3px 0 var(--plate)"></i>Started</span><span><i style="background:repeating-linear-gradient(135deg,var(--rest) 0 3px,transparent 3px 6px)"></i>Rest (cardio)</span></div>
      <div class="sec">
        <h3>Settings</h3>
        <div class="row"><span>Weight unit</span><div class="seg" id="unitSeg"><button data-v="lb">lb</button><button data-v="kg">kg</button></div></div>
        <div class="row"><span>Rest timer</span><div class="seg" id="restSeg"><button data-v="0">Off</button><button data-v="60">60s</button><button data-v="90">90s</button><button data-v="120">2m</button></div></div>
        <p class="sync" id="syncNote">Saved on this device.</p>
      </div>
    </div>
    <div id="hist" class="hidden"></div>
  </section>
  <!-- WORKOUT -->
  <section id="work" class="hidden">
    <div class="bar"><button class="iconbtn" id="backBtn" aria-label="Back to program"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="barTitle"></h2></div>
    <div class="dayhead"><p class="k" id="wkTitle"></p><p id="wkSub"></p><div class="prog"><div id="progBar"></div></div></div>
    <div id="exList"></div>
    <button class="primary finish" id="finishBtn">Finish day</button>
    <div class="navdays"><button class="secondary" id="prevDay">Previous day</button><button class="secondary" id="nextDay">Next day</button></div>
  </section>
</div>
<div class="timer" id="timer" aria-live="polite"><span class="t" id="tVal">1:30</span><span class="lbl" id="tLbl">Rest</span><button id="tAdd">+15s</button><button id="tSkip">Done</button></div>

}
function itemRec(r, i, it){
  if (!r.items[i]) r.items[i] = { checked:false, sets: it.sets.map(s => ({ w:"", r:"", d:false })) };
  return r.items[i];
}
function dayProgress(d){
  const r = rec(d.n); if (!r) return 0;
  let tot=0, got=0;
  d.items.forEach((it,i)=>{ const ir=r.items[i];
    if (it.sets.length){ tot+=it.sets.length; if(ir) got+=ir.sets.filter(s=>s.d).length; }
    else { tot+=1; if(ir&&ir.checked) got+=1; } });
  return tot? got/tot : 0;
}
function currentDayNum(){ for (const d of DAYS){ const r=rec(d.n); if(!r||!r.done) return d.n; } return 84; }

/* ---------- persistence ---------- */
let remote = null, uid = null; const pending = new Map(); const writing = new Set();
function saveLocal(){ try { localStorage.setItem(LKEY, JSON.stringify(state)); } catch(e) {} }
function touch(n){
  const r = n === "settings" ? state.settings : state.days[n]; r.updatedAt = Date.now();
  saveLocal(); queueRemote(n);
}
function queueRemote(key){
  if (!remote) return;
  clearTimeout(pending.get(key)); pending.set(key, setTimeout(()=>flush(key), 900));
}
async function flush(key){
  if (writing.has(key)) { queueRemote(key); return; }
  writing.add(key);
  try {
    const body = key === "settings" ? state.settings : state.days[key];
    await remote.collection("data/users/"+uid).doc(key === "settings" ? "settings" : "d"+key).set(JSON.parse(JSON.stringify(body)));
    $("syncNote").textContent = "Synced to your Claude account.";
  } catch(e) {
    if (e && e.code === "invalid_argument") { remote = null; $("syncNote").textContent = "Saved on this device (account sync unavailable)."; }
  } finally { writing.delete(key); }
}
async function connect(){
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const snap = await db.collection("data/users/"+id).get();
    remote = db; uid = id; let changed=false; const toPush=[];
    const seen = new Set();
    snap.docs.forEach(doc=>{
      const v = doc.data(); if (!v) return;
      if (doc.id === "settings"){ seen.add("settings"); if ((v.updatedAt||0) > (state.settings.updatedAt||0)) { state.settings = v; changed=true; } else if ((state.settings.updatedAt||0) > (v.updatedAt||0)) toPush.push("settings"); return; }
      const n = parseInt(doc.id.slice(1),10); if (!n) return; seen.add(n);
      const l = state.days[n];
      if (!l || (v.updatedAt||0) > (l.updatedAt||0)) { state.days[n]=v; changed=true; }
      else if ((l.updatedAt||0) > (v.updatedAt||0)) toPush.push(n);
    });
    Object.keys(state.days).forEach(k=>{ const n=+k; if(!seen.has(n) && state.days[n].updatedAt) toPush.push(n); });
    if (!seen.has("settings") && state.settings.updatedAt) toPush.push("settings");
    if (changed){ saveLocal(); render(); }
    toPush.forEach(queueRemote);
    $("syncNote").textContent = "Synced to your Claude account, so it follows you across devices.";
  } catch(e) { remote = null; }
}

/* ---------- home ---------- */
function renderHome(){
  const n = currentDayNum(), d = DAYS[n-1];
  $("heroNum").innerHTML = "<small>Day</small>"+n;
  $("heroWhat").textContent = isRestDay(d) ? "Rest day" : d.title;
  const lifts = d.items.filter(i=>i.sets.length).length;
  $("heroSub").textContent = isRestDay(d) ? "Cardio morning and evening, no lifting." : `Week ${d.w}, ${lifts} lifts plus cardio.`;
  $("startBtn").textContent = isRestDay(d) ? "Open cardio checklist" : (rec(n) && dayProgress(d)>0 ? "Continue workout" : "Start workout");
  const g = $("grid"); g.innerHTML = "";
  let done = 0;
  for (let w=1; w<=12; w++){
    const lab = document.createElement("div"); lab.className="wk"; lab.textContent="W"+w; g.appendChild(lab);
    for (let k=0;k<7;k++){
      const day = DAYS[(w-1)*7+k], r = rec(day.n);
      const b = document.createElement("button"); b.className="cell"; b.textContent=day.n; b.dataset.n=day.n;
      if (isRestDay(day)) b.classList.add("rest");
      if (r && r.done){ b.classList.add("done"); done++; } else if (dayProgress(day)>0) b.classList.add("part");
      if (day.n===n) b.classList.add("cur");
      b.setAttribute("aria-label", `Day ${day.n}, ${isRestDay(day)?"rest":day.title}${r&&r.done?", done":""}`);
      g.appendChild(b);
    }
  }
  $("doneCount").textContent = `${done} of 84 done`;
  document.querySelectorAll("#unitSeg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===state.settings.unit)));
  document.querySelectorAll("#restSeg button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.v===+state.settings.rest)));
}

/* ---------- history ---------- */
function collectHistory(){
  const map = new Map();
  DAYS.forEach(d=>{ const r=rec(d.n); if(!r) return;
    d.items.forEach((it,i)=>{ if(!it.sets.length) return; const ir=r.items[i]; if(!ir) return;
      const sets = ir.sets.filter(s=>s.d && (s.w!==""||s.r!=="")); if(!sets.length) return;
      const k = norm(it.name); if(!map.has(k)) map.set(k,{name:it.name, sessions:[]});
      map.get(k).sessions.push({n:d.n, sets}); }); });
  return map;
}
function lastFor(name, beforeN){
  const k = norm(name); let best=null;
  for (let n=beforeN-1; n>=1; n--){ const d=DAYS[n-1], r=rec(n); if(!r) continue;
    d.items.forEach((it,i)=>{ if(best||norm(it.name)!==k) return; const ir=r.items[i]; if(!ir) return;
      const sets=ir.sets.filter(s=>s.d&&(s.w!==""||s.r!=="")); if(sets.length) best={n,sets}; });
    if(best) return best; }
  return null;
}
const fmtSet = s => (s.w!==""? s.w : "BW") + "×" + (s.r!==""? s.r : "?");
function renderHist(){
  const h = $("hist"); h.innerHTML=""; const map = collectHistory();
  if (!map.size){ h.innerHTML = '<p class="empty">Nothing logged yet. Tick off a set in any workout and it shows up here with your best weight and every session.</p>'; return; }
  const u = state.settings.unit;
  [...map.values()].sort((a,b)=>a.name.localeCompare(b.name)).forEach(e=>{
    const best = Math.max(...e.sessions.flatMap(s=>s.sets.map(x=>parseFloat(x.w)||0)));
    const item=document.createElement("div"); item.className="hist-item";
    const btn=document.createElement("button"); btn.setAttribute("aria-expanded","false");
    const nm=document.createElement("span"); nm.className="nm"; nm.textContent=e.name;
    const bs=document.createElement("span"); bs.className="bst"; bs.textContent=(best?`Best ${best} ${u}, `:"")+`${e.sessions.length} session${e.sessions.length>1?"s":""}`;
    btn.append(nm,bs);
    const body=document.createElement("div"); body.className="hist-body hidden";
    e.sessions.slice().reverse().forEach(s=>{ const p=document.createElement("p"); const sp=document.createElement("span"); sp.textContent="Day "+s.n; p.append(sp, document.createTextNode(s.sets.map(fmtSet).join(",  "))); body.appendChild(p); });
    btn.onclick=()=>{ const open=body.classList.toggle("hidden"); btn.setAttribute("aria-expanded",String(!open)); };
    item.append(btn,body); h.appendChild(item);
  });
}

/* ---------- workout ---------- */
function openDay(n){
  curDay = n; $("home").classList.add("hidden"); $("work").classList.remove("hidden");
  renderWork(); window.scrollTo(0,0);
}
function closeDay(){ curDay=null; stopTimer(); $("work").classList.add("hidden"); $("home").classList.remove("hidden"); render(); window.scrollTo(0,0); }
function renderWork(){
  const d = DAYS[curDay-1]; const r = rec(curDay) || { items:{} }; const u = state.settings.unit;
  $("barTitle").textContent = `Day ${d.n}`;
  $("wkTitle").textContent = isRestDay(d) ? "Rest day" : d.title;
  $("wkSub").textContent = `Week ${d.w}` + (isRestDay(d) ? ". Cardio only today." : `. Weights in ${u}.`);
  const list = $("exList"); list.innerHTML = "";
  let groupEl = null, groupKey = null;
  d.items.forEach((it,i)=>{
    const ir = r.items[i];
    let parent = list;
    if (it.group){
      if (it.group !== groupKey){ groupKey = it.group; groupEl = document.createElement("div"); groupEl.className="group";
        const gl=document.createElement("p"); gl.className="glabel"; gl.textContent=it.group.split("#")[0]; groupEl.appendChild(gl); list.appendChild(groupEl); }
      parent = groupEl;
    } else { groupKey = null; }
    const card = document.createElement("div"); card.className="ex"; card.dataset.i=i;
    if (!it.sets.length){
      card.classList.add("simple");
      const h=document.createElement("h4"); h.textContent=it.name;
      const wrap=document.createElement("div"); wrap.style.flex="1"; wrap.appendChild(h);
      if (it.detail){ const p=document.createElement("p"); p.className="det"; p.textContent=it.detail; wrap.appendChild(p); }
      const c=document.createElement("button"); c.className="chk"; c.dataset.act="item"; c.innerHTML=CHECK;
      const on = !!(ir && ir.checked); c.setAttribute("aria-pressed",String(on)); c.setAttribute("aria-label",`Mark ${it.name} done`);
      if (on) card.classList.add("complete");
      card.append(wrap,c); parent.appendChild(card); return;
    }
    const h=document.createElement("h4"); h.textContent=it.name; card.appendChild(h);
    const p=document.createElement("p"); p.className="det"; p.textContent=it.detail; card.appendChild(p);
    const last = lastFor(it.name, d.n);
    if (last){ const l=document.createElement("p"); l.className="last"; l.innerHTML="Last time (Day "+last.n+"): <b></b>"; l.querySelector("b").textContent=last.sets.map(fmtSet).join(",  "); card.appendChild(l); }
    const sets = ir ? ir.sets : it.sets.map(()=>({w:"",r:"",d:false}));
    const tpl = it.sets;
    const box=document.createElement("div"); box.className="sets";
    const ch=document.createElement("div"); ch.className="colhead"; ch.innerHTML=`<span>Set</span><span>${u}</span><span></span><span>Reps</span><span></span>`; box.appendChild(ch);
    let work=0, allDone = sets.length>0;
    sets.forEach((s,j)=>{
      const t = tpl[j] || {k:"",t:""};
      const row=document.createElement("div"); row.className="set"+(s.d?" done":""); row.dataset.j=j;
      const tag=document.createElement("span"); tag.className="tag "+t.k;
      tag.textContent = t.k==="W" ? "W" : (t.k==="D" ? "D"+(++work) : String(++work));
      tag.title = t.k==="W" ? "Warm-up set" : (t.k==="D" ? "Drop set" : "Working set");
      const prevW = j>0 ? (sets.slice(0,j).map(x=>x.w).filter(x=>x!=="").pop()||"") : "";
      const w=document.createElement("input"); w.type="text"; w.inputMode="decimal"; w.value=s.w; w.placeholder=prevW||"–"; w.dataset.f="w"; w.setAttribute("aria-label",`Set ${j+1} weight`);
      const x=document.createElement("span"); x.className="x"; x.textContent="×";
      const rp=document.createElement("input"); rp.type="text"; rp.inputMode="numeric"; rp.value=s.r; rp.placeholder=t.t||"reps"; rp.dataset.f="r"; rp.setAttribute("aria-label",`Set ${j+1} reps, target ${t.t||"to failure"}`);
      const c=document.createElement("button"); c.className="chk"; c.dataset.act="set"; c.innerHTML=CHECK; c.setAttribute("aria-pressed",String(!!s.d)); c.setAttribute("aria-label",`Mark set ${j+1} done`);
      if(!s.d) allDone=false;
      row.append(tag,w,x,rp,c); box.appendChild(row);
    });
    const add=document.createElement("button"); add.className="addset"; add.dataset.act="add"; add.textContent="+ Add set"; box.appendChild(add);
    if (sets.length>tpl.length){ const rm=document.createElement("button"); rm.className="addset"; rm.dataset.act="rm"; rm.textContent="  Remove last set"; rm.style.marginLeft="12px"; box.appendChild(rm); }
    card.appendChild(box);
    if (allDone) card.classList.add("complete");
    parent.appendChild(card);
  });
  updateProgress();
  const R = rec(curDay);
  $("finishBtn").textContent = R && R.done ? "Day finished. Mark as not done" : "Finish day";
  $("prevDay").disabled = curDay===1; $("nextDay").disabled = curDay===84;
}
function updateProgress(){ $("progBar").style.width = Math.round(dayProgress(DAYS[curDay-1])*100)+"%"; }

let saveT=null;
$("exList").addEventListener("input", e=>{
  const inp=e.target; if(!inp.dataset.f) return;
  const card=inp.closest(".ex"), row=inp.closest(".set"); const i=+card.dataset.i, j=+row.dataset.j;
  const d=DAYS[curDay-1], r=ensureRec(curDay), ir=itemRec(r,i,d.items[i]);
  while (ir.sets.length<=j) ir.sets.push({w:"",r:"",d:false});
  ir.sets[j][inp.dataset.f] = inp.value.trim();
  if (inp.dataset.f==="w"){ // update placeholders of later rows
    card.querySelectorAll(".set").forEach(rw=>{ const k=+rw.dataset.j; if(k>j){ const wi=rw.querySelector('[data-f="w"]'); const pv=ir.sets.slice(0,k).map(x=>x.w).filter(x=>x!=="").pop()||""; wi.placeholder=pv||"–"; } });
  }
  clearTimeout(saveT); saveT=setTimeout(()=>touch(curDay),400);
});
$("exList").addEventListener("click", e=>{
  const btn=e.target.closest("button[data-act]"); if(!btn) return;
  const card=btn.closest(".ex"); const i=+card.dataset.i; const d=DAYS[curDay-1]; const it=d.items[i];
  const r=ensureRec(curDay), ir=itemRec(r,i,it);
  const act=btn.dataset.act;
  if (act==="item"){ ir.checked=!ir.checked; }
  else if (act==="set"){
    const j=+btn.closest(".set").dataset.j; const s=ir.sets[j];
    // pull any typed values not yet saved
    const row=btn.closest(".set"); s.w=row.querySelector('[data-f="w"]').value.trim(); s.r=row.querySelector('[data-f="r"]').value.trim();
    s.d=!s.d;
    if (s.d){
      if (s.w===""){ const pv=ir.sets.slice(0,j).map(x=>x.w).filter(x=>x!=="").pop(); if(pv) s.w=pv; }
      if (s.r===""){ const t=(it.sets[j]||{}).t||""; const m=t.match(/^(\d+)(?:-(\d+))?$/); if(m) s.r=m[2]||m[1]; }
      const next = nextStep(i,j);
      if (+state.settings.rest>0) startTimer(+state.settings.rest, next);
    }
  }
  else if (act==="add"){ const lastW = ir.sets.map(x=>x.w).filter(x=>x!=="").pop()||""; ir.sets.push({w:"",r:"",d:false}); }
  else if (act==="rm"){ if (ir.sets.length>it.sets.length) ir.sets.pop(); }
  touch(curDay);
  const y=window.scrollY; renderWork(); window.scrollTo(0,y);
});
function nextStep(i,j){
  const d=DAYS[curDay-1], r=rec(curDay);
  const it=d.items[i]; const ir=r.items[i];
  if (ir.sets.some((s,k)=>k>j && !s.d)) return `Next: ${it.name}, set ${j+2}`;
  for (let k=i+1;k<d.items.length;k++){ const o=d.items[k]; if(o.sets.length) return "Next: "+o.name; }
  return "Last lift done. Cardio next.";
}
$("finishBtn").onclick=()=>{ const r=ensureRec(curDay); r.done=!r.done; if(r.done) r.completedAt=Date.now(); touch(curDay);
  if (r.done){ stopTimer(); closeDay(); } else renderWork(); };
$("prevDay").onclick=()=>{ if(curDay>1){ stopTimer(); openDay(curDay-1);} };
$("nextDay").onclick=()=>{ if(curDay<84){ stopTimer(); openDay(curDay+1);} };
$("backBtn").onclick=closeDay;
$("startBtn").onclick=()=>openDay(currentDayNum());
$("grid").addEventListener("click",e=>{ const b=e.target.closest(".cell"); if(b) openDay(+b.dataset.n); });
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  $("plan").classList.toggle("hidden", t.dataset.tab!=="plan"); $("hist").classList.toggle("hidden", t.dataset.tab!=="hist");
  if (t.dataset.tab==="hist") renderHist();
});
$("unitSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.settings.unit=b.dataset.v; touch("settings"); renderHome(); });
$("restSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.settings.rest=+b.dataset.v; touch("settings"); renderHome(); });

/* ---------- rest timer ---------- */
let tEnd=0, tInt=null, beeped=false;
function startTimer(sec,label){ tEnd=Date.now()+sec*1000; beeped=false; $("tLbl").textContent=label||"Rest"; $("timer").classList.add("on"); $("timer").classList.remove("over"); clearInterval(tInt); tick(); tInt=setInterval(tick,250); }
function stopTimer(){ clearInterval(tInt); tInt=null; $("timer").classList.remove("on","over"); }
function tick(){
  const left=Math.round((tEnd-Date.now())/1000); const a=Math.abs(left);
  $("tVal").textContent=(left<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");
  if(left<=0 && !beeped){ beeped=true; $("timer").classList.add("over"); beep(); if(navigator.vibrate) try{navigator.vibrate([200,100,200]);}catch(e){} }
}
function beep(){ try{ const C=window.AudioContext||window.webkitAudioContext; const ac=new C(); [0,0.25].forEach(o=>{ const os=ac.createOscillator(), g=ac.createGain(); os.frequency.value=880; g.gain.setValueAtTime(0.18,ac.currentTime+o); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+o+0.2); os.connect(g).connect(ac.destination); os.start(ac.currentTime+o); os.stop(ac.currentTime+o+0.22); }); }catch(e){} }
$("tAdd").onclick=()=>{ tEnd+=15000; if(tEnd>Date.now()){ beeped=false; $("timer").classList.remove("over"); } tick(); };
$("tSkip").onclick=stopTimer;

function render(){ if (curDay) renderWork(); else { renderHome(); if(!$("hist").classList.contains("hidden")) renderHist(); } }
render();
connect();
</script>
